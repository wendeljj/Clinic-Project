<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CProjeto_Clinica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Cadastrar Paciente</h2>
    
    <div id="mensagem" class="mensagem hidden"></div>

    <form id="formPaciente">
      <div class="campo">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Ex: Ana Maria">
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" required placeholder="000.000.000-00">
        </div>

        <div class="campo">
          <label for="dataNascimento">Data de Nascimento</label>
          <input type="date" id="dataNascimento" required>
        </div>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="genero">Gênero</label>
          <select id="genero" required>
            <option value="">Selecione...</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="(11) 99999-8888">
        </div>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="paciente@email.com">
      </div>

      <button type="submit" id="btnSalvar">Cadastrar Paciente</button>
    </form>

    <hr>

    <h3>Pacientes Cadastrados</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Nascimento</th>
          <th>Gênero</th>
          <th>Telefone</th>
        </tr>
      </thead>
      <tbody id="tabelaPacientes">
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
